name: Security scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep:
    name: Semgrep (code patterns)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Semgrep report (all findings)
        run: semgrep scan --config p/python --config p/javascript --json-output=semgrep.json

      - name: Save results for the summary
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: semgrep.json

      - name: Semgrep gate (fail on ERROR)
        run: semgrep scan --config p/python --config p/javascript --severity ERROR --error

  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit report (all findings)
        run: bandit -r app/python-api --exit-zero

      - name: Bandit results as JSON
        run: bandit -r app/python-api --exit-zero -f json -o bandit.json

      - name: Save results for the summary
        uses: actions/upload-artifact@v7
        with:
          name: bandit-results
          path: bandit.json

      - name: Bandit gate (fail on HIGH)
        run: bandit -r app/python-api -lll

  npm-audit:
    name: npm audit (dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/node-api
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: npm audit results as JSON
        run: npm audit --json > npm-audit.json || true

      - name: Save results for the summary
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-results
          path: app/node-api/npm-audit.json

      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

  summary:
    name: Findings summary
    runs-on: ubuntu-latest
    needs: [semgrep, bandit, npm-audit]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Collect the robots' results
        uses: actions/download-artifact@v8
        with:
          path: results
          merge-multiple: true

      - name: Build the summary table
        run: python3 scripts/summarize.py results > summary.md

      - name: Show the summary on the run page
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file summary.md