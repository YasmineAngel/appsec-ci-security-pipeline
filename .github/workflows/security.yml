name: Security scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep:
    name: Semgrep (code patterns)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/python --config p/javascript